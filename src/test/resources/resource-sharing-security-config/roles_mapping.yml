---
# In this file users, backendroles and hosts can be mapped to Security roles.
# Permissions for OpenSearch roles are configured in roles.yml

_meta:
  type: "rolesmapping"
  config_version: 2

# Define your roles mapping here

## Demo roles mapping

all_access:
  reserved: false
  backend_roles:
  - "admin"
  description: "Maps admin to all_access"

logstash:
  reserved: false
  backend_roles:
  - "logstash"

kibana_user:
  reserved: false
  backend_roles:
  - "kibanauser"
  description: "Maps kibanauser to kibana_user"

readall:
  reserved: false
  backend_roles:
  - "readall"

manage_snapshots:
  reserved: false
  backend_roles:
  - "snapshotrestore"

kibana_server:
  reserved: true
  users:
  - "kibanaserver"

## ResourceSharingIT: map the test users to the roles the tests need. The pre-defined
## security_analytics_full_access / alerting_full_access roles grant the plugin-level trust
## for detector creation; sa_extra_role adds resource-sharing and correlation-rule permissions.

security_analytics_full_access:
  reserved: false
  users:
  - "sa_owner_user"
  - "sa_other_user"
  - "sa_third_user"

alerting_full_access:
  reserved: false
  users:
  - "sa_owner_user"
  - "sa_other_user"
  - "sa_third_user"

sa_extra_role:
  reserved: false
  users:
  - "sa_owner_user"
  - "sa_other_user"
  - "sa_third_user"
